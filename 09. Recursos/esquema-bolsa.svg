<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1035" viewBox="0 0 1000 1035" role="img" aria-labelledby="title desc">
<title id="title">Orden de resolución de la bolsa</title><desc id="desc">CR 6.2, 6.7, 7.7 y 9.2</desc>
<rect width="100%" height="100%" fill="#f7f9fc"/>
<style>text{font-family:Arial,sans-serif;fill:#17334b}.title{font-size:32px;font-weight:bold}.body{font-size:22px}.small{font-size:18px}.step{font-size:23px;font-weight:bold}</style>
<text x="40" y="58" font-family="Arial" font-size="32" font-weight="bold">Orden de resolución de la bolsa</text>
<text x="40" y="95" font-family="Arial" font-size="18">CR 2.3 · Aplicación desde el 16 de octubre de 2026</text>
<text x="40" y="124" font-family="Arial" font-size="18">CR 6.2, 6.7, 7.7 y 9.2</text>
<rect x="40" y="155" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="187" font-family="Arial" font-size="23" font-weight="bold">1 · Ocurre el evento de disparo</text>
<text x="62" y="220" font-family="Arial" font-size="22">Añade la habilidad a la bolsa cuando corresponda.</text>
<text x="62" y="247" font-family="Arial" font-size="22">Si hay un efecto en resolución, espera hasta que termine.</text>
<path d="M500 277 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="300" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="332" font-family="Arial" font-size="23" font-weight="bold">2 · Termina la resolución y chequea el estado</text>
<text x="62" y="365" font-family="Arial" font-size="22">Completa el efecto y realiza el chequeo del estado del juego.</text>
<text x="62" y="392" font-family="Arial" font-size="22">Añade los nuevos disparos en sus momentos correspondientes.</text>
<path d="M500 422 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="445" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="477" font-family="Arial" font-size="23" font-weight="bold">3 · Comienza a resolver la bolsa</text>
<text x="62" y="510" font-family="Arial" font-size="22">Empieza el activo si tiene habilidades; si no, sigue el orden de turno.</text>
<text x="62" y="537" font-family="Arial" font-size="22">El jugador que recibe la bolsa elige una habilidad suya y la resuelve.</text>
<path d="M500 567 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="590" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="622" font-family="Arial" font-size="23" font-weight="bold">4 · Ese jugador continúa mientras tenga habilidades</text>
<text x="62" y="655" font-family="Arial" font-size="22">Tras resolver y chequear el estado, resuelve otra habilidad suya.</text>
<text x="62" y="682" font-family="Arial" font-size="22">Cuando no le quedan, pasa al siguiente jugador con habilidades.</text>
<path d="M500 712 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="735" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="767" font-family="Arial" font-size="23" font-weight="bold">5 · Bolsa vacía</text>
<text x="62" y="800" font-family="Arial" font-size="22">Continúa el procedimiento de la partida que había quedado pendiente.</text>
<text x="62" y="827" font-family="Arial" font-size="22">Habilidades flotantes y retardadas esperan fuera hasta dispararse.</text>
<text x="40" y="885" font-family="Arial" font-size="18">Un nuevo disparo del activo no interrumpe al jugador que está resolviendo la bolsa.</text>
<text x="40" y="915" font-family="Arial" font-size="18">Si un jugador sale, sus disparos se retiran; sus efectos con duración pueden continuar.</text>
</svg>
