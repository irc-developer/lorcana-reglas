<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1150" viewBox="0 0 1000 1150" role="img" aria-labelledby="title desc">
<title id="title">Conceptos básicos de Lorcana</title><desc id="desc">CR 1, 4, 5, 7 y 8</desc>
<rect width="100%" height="100%" fill="#f7f9fc"/>
<style>text{font-family:Arial,sans-serif;fill:#17334b}.title{font-size:32px;font-weight:bold}.body{font-size:22px}.small{font-size:18px}.step{font-size:23px;font-weight:bold}</style>
<text x="40" y="58" font-family="Arial" font-size="32" font-weight="bold">Conceptos básicos de Lorcana</text>
<text x="40" y="95" font-family="Arial" font-size="18">CR 2.3 · Aplicación desde el 16 de octubre de 2026</text>
<text x="40" y="124" font-family="Arial" font-size="18">CR 1, 4, 5, 7 y 8</text>
<rect x="40" y="155" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="187" font-family="Arial" font-size="23" font-weight="bold">Zonas y recursos</text>
<text x="62" y="220" font-family="Arial" font-size="22">Desterrar: pasar de juego al descarte; también puede afectar objetos o lugares.</text>
<text x="62" y="247" font-family="Arial" font-size="22">Tinta: recurso de pago. Gotas: contadores; desde 16/10/2026 no son cartas.</text>
<path d="M500 277 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="300" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="332" font-family="Arial" font-size="23" font-weight="bold">Acciones de turno</text>
<text x="62" y="365" font-family="Arial" font-size="22">Quest: agotar un personaje legal y ganar su valor de Leyenda.</text>
<text x="62" y="392" font-family="Arial" font-size="22">Desafío: enfrenta un personaje propio con un personaje o lugar oponente legal.</text>
<path d="M500 422 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="445" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="477" font-family="Arial" font-size="23" font-weight="bold">Estados de las cartas</text>
<text x="62" y="510" font-family="Arial" font-size="22">Preparado o agotado: orientación que refleja el estado de la carta.</text>
<text x="62" y="537" font-family="Arial" font-size="22">Seco: puede realizar las acciones permitidas, si cumple sus demás requisitos.</text>
<path d="M500 567 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="590" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="622" font-family="Arial" font-size="23" font-weight="bold">Coste y características</text>
<text x="62" y="655" font-family="Arial" font-size="22">Coste: valor reglamentario; el pago puede cambiar por costes alternativos.</text>
<text x="62" y="682" font-family="Arial" font-size="22">Fuerza determina daño; Voluntad se compara con el daño para desterrar.</text>
<path d="M500 712 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="735" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="767" font-family="Arial" font-size="23" font-weight="bold">Palabras clave de desafío</text>
<text x="62" y="800" font-family="Arial" font-size="22">Bodyguard limita el defensor si hay un Guardaespaldas legal.</text>
<text x="62" y="827" font-family="Arial" font-size="22">Evasive limita al atacante; Alert ignora ese limitador. Challenger suma Fuerza.</text>
<path d="M500 857 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="880" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="912" font-family="Arial" font-size="23" font-weight="bold">Cartas y Leyenda</text>
<text x="62" y="945" font-family="Arial" font-size="22">Personaje, objeto, acción y localización son tipos de carta; canción es acción.</text>
<text x="62" y="972" font-family="Arial" font-size="22">Leyenda: puntos para ganar; la victoria habitual requiere 20.</text>
<text x="40" y="1030" font-family="Arial" font-size="18">Lee el texto completo: estos conceptos no sustituyen requisitos ni excepciones.</text>
</svg>
