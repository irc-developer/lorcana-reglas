<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1035" viewBox="0 0 1000 1035" role="img" aria-labelledby="title desc">
<title id="title">Reconocer tipos de habilidades</title><desc id="desc">CR 4.4, 6.2, 6.4–6.6 y 8</desc>
<rect width="100%" height="100%" fill="#f7f9fc"/>
<style>text{font-family:Arial,sans-serif;fill:#17334b}.title{font-size:32px;font-weight:bold}.body{font-size:22px}.small{font-size:18px}.step{font-size:23px;font-weight:bold}</style>
<text x="40" y="58" font-family="Arial" font-size="32" font-weight="bold">Reconocer tipos de habilidades</text>
<text x="40" y="95" font-family="Arial" font-size="18">CR 2.3 · Aplicación desde el 16 de octubre de 2026</text>
<text x="40" y="124" font-family="Arial" font-size="18">CR 4.4, 6.2, 6.4–6.6 y 8</text>
<rect x="40" y="155" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="187" font-family="Arial" font-size="23" font-weight="bold">Activada · coste — efecto</text>
<text x="62" y="220" font-family="Arial" font-size="22">El jugador anuncia la habilidad, paga el coste y resuelve.</text>
<text x="62" y="247" font-family="Arial" font-size="22">Comprueba el coste y el momento permitido por el texto completo.</text>
<path d="M500 277 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="300" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="332" font-family="Arial" font-size="23" font-weight="bold">Disparada · evento y efecto</text>
<text x="62" y="365" font-family="Arial" font-size="22">When, whenever, first/next time, at the start/end…</text>
<text x="62" y="392" font-family="Arial" font-size="22">Cuando ocurre el evento se añade a la bolsa; no interrumpe otro efecto.</text>
<path d="M500 422 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="445" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="477" font-family="Arial" font-size="23" font-weight="bold">Estática · reglas o características</text>
<text x="62" y="510" font-family="Arial" font-size="22">Se aplica según su condición y duración, sin entrar en la bolsa.</text>
<text x="62" y="537" font-family="Arial" font-size="22">Una prohibición «can’t» puede ser estática; no implica reemplazo.</text>
<path d="M500 567 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="590" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="622" font-family="Arial" font-size="23" font-weight="bold">Reemplazo · cambiar un evento antes de que ocurra</text>
<text x="62" y="655" font-family="Arial" font-size="22">Identifica qué evento sustituye y por cuál. «Instead» es habitual.</text>
<text x="62" y="682" font-family="Arial" font-size="22">No basta con ver «would», «can’t» o «enters» para clasificarlo.</text>
<path d="M500 712 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="735" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="767" font-family="Arial" font-size="23" font-weight="bold">Entrada y modificadores</text>
<text x="62" y="800" font-family="Arial" font-size="22">«Enters»: efectos propios primero; después otras fuentes, antes de entrar.</text>
<text x="62" y="827" font-family="Arial" font-size="22">Dar o quitar una habilidad es un efecto; identifica la habilidad que lo genera.</text>
<text x="40" y="885" font-family="Arial" font-size="18">Las palabras clave representan habilidades; no constituyen un tipo separado.</text>
<text x="40" y="915" font-family="Arial" font-size="18">Lee el texto completo y las reglas específicas antes de decidir la clasificación.</text>
</svg>
