<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1150" viewBox="0 0 1000 1150" role="img" aria-labelledby="title desc">
<title id="title">Estructura del turno</title><desc id="desc">CR 3 y 4</desc>
<rect width="100%" height="100%" fill="#f7f9fc"/>
<style>text{font-family:Arial,sans-serif;fill:#17334b}.title{font-size:32px;font-weight:bold}.body{font-size:22px}.small{font-size:18px}.step{font-size:23px;font-weight:bold}</style>
<text x="40" y="58" font-family="Arial" font-size="32" font-weight="bold">Estructura del turno</text>
<text x="40" y="95" font-family="Arial" font-size="18">CR 2.3 · Aplicación desde el 16 de octubre de 2026</text>
<text x="40" y="124" font-family="Arial" font-size="18">CR 3 y 4</text>
<rect x="40" y="155" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="187" font-family="Arial" font-size="23" font-weight="bold">Fase inicial · Ready</text>
<text x="62" y="220" font-family="Arial" font-size="22">Prepara tus cartas según las restricciones aplicables.</text>
<path d="M500 277 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="300" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="332" font-family="Arial" font-size="23" font-weight="bold">Fase inicial · Set</text>
<text x="62" y="365" font-family="Arial" font-size="22">Se secan tus personajes; gana Leyenda de tus localizaciones.</text>
<text x="62" y="392" font-family="Arial" font-size="22">Añade los disparos de comienzo del turno y resuelve la bolsa.</text>
<path d="M500 422 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="445" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="477" font-family="Arial" font-size="23" font-weight="bold">Fase inicial · Draw</text>
<text x="62" y="510" font-family="Arial" font-size="22">Roba una carta. Quien empieza omite este paso en su primer turno.</text>
<path d="M500 567 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="590" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="622" font-family="Arial" font-size="23" font-weight="bold">Fase principal · acciones en cualquier orden legal</text>
<text x="62" y="655" font-family="Arial" font-size="22">Juega cartas, activa habilidades, ve de aventura, desafía y mueve personajes.</text>
<text x="62" y="682" font-family="Arial" font-size="22">Puedes poner una carta como tinta una vez por turno, salvo permisos adicionales.</text>
<path d="M500 712 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="735" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="767" font-family="Arial" font-size="23" font-weight="bold">Completa cada acción</text>
<text x="62" y="800" font-family="Arial" font-size="22">Paga costes, cumple requisitos y resuelve la bolsa en sus momentos.</text>
<text x="62" y="827" font-family="Arial" font-size="22">Una habilidad activada puede tener coste de tinta sin coste de agotamiento.</text>
<path d="M500 857 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="880" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="912" font-family="Arial" font-size="23" font-weight="bold">Fase final del turno</text>
<text x="62" y="945" font-family="Arial" font-size="22">Resuelve los disparos de final de turno y los chequeos aplicables.</text>
<text x="62" y="972" font-family="Arial" font-size="22">Terminan los efectos que duran este turno; continúa el siguiente jugador.</text>
<text x="40" y="1030" font-family="Arial" font-size="18">Los efectos con otra duración no terminan automáticamente al finalizar este turno.</text>
</svg>
