<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1180" viewBox="0 0 1000 1180" role="img" aria-labelledby="title desc">
<title id="title">Declarar y resolver un desafío</title><desc id="desc">CR 4.6, 1.8, 1.9 y 7.7</desc>
<rect width="100%" height="100%" fill="#f7f9fc"/>
<style>text{font-family:Arial,sans-serif;fill:#17334b}.title{font-size:32px;font-weight:bold}.body{font-size:22px}.small{font-size:18px}.step{font-size:23px;font-weight:bold}</style>
<text x="40" y="58" font-family="Arial" font-size="32" font-weight="bold">Declarar y resolver un desafío</text>
<text x="40" y="95" font-family="Arial" font-size="18">CR 2.3 · Aplicación desde el 16 de octubre de 2026</text>
<text x="40" y="124" font-family="Arial" font-size="18">CR 4.6, 1.8, 1.9 y 7.7</text>
<rect x="40" y="155" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="187" font-family="Arial" font-size="23" font-weight="bold">1 · Declara atacante y defensor</text>
<text x="62" y="220" font-family="Arial" font-size="22">Personaje atacante preparado y con permiso para desafiar.</text>
<text x="62" y="247" font-family="Arial" font-size="22">Defensor: personaje oponente agotado o una localización oponente.</text>
<path d="M500 277 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="300" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="332" font-family="Arial" font-size="23" font-weight="bold">2 · Requisitos, limitadores y pagos</text>
<text x="62" y="365" font-family="Arial" font-size="22">Comprueba Evasive, Alert, Bodyguard y las demás restricciones.</text>
<text x="62" y="392" font-family="Arial" font-size="22">Paga los costes adicionales legales y agota al atacante.</text>
<path d="M500 422 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="445" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="477" font-family="Arial" font-size="23" font-weight="bold">3 · El desafío ocurre: bolsa antes del daño</text>
<text x="62" y="510" font-family="Arial" font-size="22">Comienzan los efectos «mientras desafía». Resuelve la bolsa.</text>
<text x="62" y="537" font-family="Arial" font-size="22">Preparar al atacante no lo retira del desafío.</text>
<path d="M500 567 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="590" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="622" font-family="Arial" font-size="23" font-weight="bold">4 · Calcula e inflige el daño simultáneamente</text>
<text x="62" y="655" font-family="Arial" font-size="22">Aplica Fuerza, modificadores de daño, Resist y reemplazos aplicables.</text>
<text x="62" y="682" font-family="Arial" font-size="22">Una localización recibe daño, pero no hace daño de vuelta.</text>
<path d="M500 712 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="735" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="767" font-family="Arial" font-size="23" font-weight="bold">5 · Chequeo del estado del juego y bolsa</text>
<text x="62" y="800" font-family="Arial" font-size="22">Destierra por daño letal y resuelve las habilidades pendientes.</text>
<text x="62" y="827" font-family="Arial" font-size="22">Un disparo no se resuelve entre dos partes de un mismo efecto.</text>
<path d="M500 857 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="880" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="912" font-family="Arial" font-size="23" font-weight="bold">6 · Final del desafío</text>
<text x="62" y="945" font-family="Arial" font-size="22">Sin bolsa pendiente, terminan los efectos «mientras desafía».</text>
<text x="62" y="972" font-family="Arial" font-size="22">Los disparos «después del desafío» ocurren al concluirlo.</text>
<text x="40" y="1030" font-family="Arial" font-size="18">Si un participante sale antes del daño: resuelve la bolsa restante y cierra el desafío.</text>
<text x="40" y="1060" font-family="Arial" font-size="18">No se intercalan otras acciones de turno en mitad de este procedimiento.</text>
</svg>
