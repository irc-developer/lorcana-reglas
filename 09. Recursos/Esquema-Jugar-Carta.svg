<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1325" viewBox="0 0 1000 1325" role="img" aria-labelledby="title desc">
<title id="title">Jugar una carta, paso a paso</title><desc id="desc">CR 4.3, 1.5, 1.13 y 6.7.9</desc>
<rect width="100%" height="100%" fill="#f7f9fc"/>
<style>text{font-family:Arial,sans-serif;fill:#17334b}.title{font-size:32px;font-weight:bold}.body{font-size:22px}.small{font-size:18px}.step{font-size:23px;font-weight:bold}</style>
<text x="40" y="58" font-family="Arial" font-size="32" font-weight="bold">Jugar una carta, paso a paso</text>
<text x="40" y="95" font-family="Arial" font-size="18">CR 2.3 · Aplicación desde el 16 de octubre de 2026</text>
<text x="40" y="124" font-family="Arial" font-size="18">CR 4.3, 1.5, 1.13 y 6.7.9</text>
<rect x="40" y="155" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="187" font-family="Arial" font-size="23" font-weight="bold">1 · Anuncia y revela</text>
<text x="62" y="220" font-family="Arial" font-size="22">Revela desde su zona actual; comprueba permiso, oportunidad y prohibiciones.</text>
<text x="62" y="247" font-family="Arial" font-size="22">Poder jugar desde el descarte no proporciona por sí solo una acción extra.</text>
<path d="M500 277 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="300" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="332" font-family="Arial" font-size="23" font-weight="bold">2 · Elige el modo y calcula el coste total</text>
<text x="62" y="365" font-family="Arial" font-size="22">Coste normal o un coste alternativo legal: Shift, cantar, gratis u otro.</text>
<text x="62" y="392" font-family="Arial" font-size="22">Aplica incrementos y reducciones; gratis no elimina requisitos.</text>
<path d="M500 422 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="445" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="477" font-family="Arial" font-size="23" font-weight="bold">3 · Paga íntegramente</text>
<text x="62" y="510" font-family="Arial" font-size="22">Agota tinta o retira gotas para costes de tinta; cumple los demás pagos.</text>
<text x="62" y="537" font-family="Arial" font-size="22">Si el pago cambia la zona de la carta, la jugada iniciada continúa desde allí.</text>
<path d="M500 567 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="590" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="622" font-family="Arial" font-size="23" font-weight="bold">4 · La carta está jugada</text>
<text x="62" y="655" font-family="Arial" font-size="22">Los disparos por jugar se añaden a la bolsa cuando corresponda.</text>
<text x="62" y="682" font-family="Arial" font-size="22">Todavía no se resuelven; termina el proceso de jugar.</text>
<path d="M500 712 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="735" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="767" font-family="Arial" font-size="23" font-weight="bold">5a · Si es personaje, objeto o localización</text>
<text x="62" y="800" font-family="Arial" font-size="22">Aplica «enters» propios y después los de otras fuentes, antes de entrar.</text>
<text x="62" y="827" font-family="Arial" font-size="22">Coloca la carta en juego; Shift forma la pila cumpliendo su variante.</text>
<text x="435" y="870" font-family="Arial" font-size="18">O bien 5b</text>
<rect x="40" y="880" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="912" font-family="Arial" font-size="23" font-weight="bold">5b · Alternativa: si es una acción</text>
<text x="62" y="945" font-family="Arial" font-size="22">Resuelve su efecto completo en juego y después ponla en el descarte.</text>
<text x="62" y="972" font-family="Arial" font-size="22">No se cuenta a sí misma en el descarte mientras resuelve.</text>
<path d="M500 1002 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#3a7b91" stroke-width="2"/>
<rect x="40" y="1025" width="920" height="120" rx="14" fill="white" stroke="#b6ced9" stroke-width="2"/>
<text x="62" y="1057" font-family="Arial" font-size="23" font-weight="bold">6 · Chequeo de estado y habilidades pendientes</text>
<text x="62" y="1090" font-family="Arial" font-size="22">Completa los chequeos aplicables y resuelve la bolsa según CR 7.7.</text>
<text x="62" y="1117" font-family="Arial" font-size="22">Después se puede elegir otra acción de turno.</text>
<text x="40" y="1175" font-family="Arial" font-size="18">Las gotas son contadores: no son cartas ni se agotan.</text>
<text x="40" y="1205" font-family="Arial" font-size="18">Retirar contadores como coste directo es distinto de utilizarlos para pagar tinta.</text>
</svg>
